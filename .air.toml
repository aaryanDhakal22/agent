#:schema https://json.schemastore.org/any.json

# Air hot-reload for the agent (dev). CGO-free build so it matches the arm64
# release path. `include_ext` covers .html/.js/.css so edits to the embedded
# web UI (internal/transport/web/index.html + static/) trigger a rebuild too.
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/agent"
  cmd = "CGO_ENABLED=0 go build -o ./tmp/agent ./cmd/main.go"
  delay = 1000
  entrypoint = ["./tmp/agent"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "tests", "sql"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "js", "css"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  app_start_timeout = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
